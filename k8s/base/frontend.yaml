# ─────────────────────────────────────────────────────────────────────────────
# frontend.yaml — Next.js 14 standalone server
#
# IMPORTANT — NEXT_PUBLIC_API_URL:
#   This variable is baked into the JS bundle at `next build` time.
#   Setting it here as a runtime env var has NO EFFECT on client-side code.
#
#   The correct value is the external URL (same as EXTERNAL_URL in ConfigMap).
#   It must be passed as a Docker build argument:
#
#     docker build --build-arg NEXT_PUBLIC_API_URL=http://excel-ai.yourdomain.com \
#       -f docker/Dockerfile.frontend -t excel-ai-frontend:latest .
#
#   See Makefile: `make build-frontend DOMAIN=excel-ai.yourdomain.com`
#   See k8s/DEPLOY.md for full instructions.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: excel-ai
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: excel-ai-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: excel-ai
spec:
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
