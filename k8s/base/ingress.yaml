# ─────────────────────────────────────────────────────────────────────────────
# ingress.yaml — Routes external traffic to frontend and backend
#
# K3s ships with Traefik by default — NO extra ingress controller needed.
# ingressClassName: traefik  ← works out of the box on K3s
#
# ACCESS WITHOUT A DOMAIN (Oracle Free VM):
#   Use nip.io — a free wildcard DNS service.
#   If your Oracle VM IP is  130.61.2.15, your host is:
#     130.61.2.15.nip.io
#   All subdomains resolve to the IP — no DNS setup needed.
#
# WHAT TO CHANGE:
#   Replace the `host:` value below with:
#     - Your Oracle VM public IP + .nip.io  (no domain needed)
#     - OR your actual domain (if you have one)
#
# UPLOAD SIZE:
#   Traefik allows up to 10MB by default. To raise the limit, add:
#     traefik.ingress.kubernetes.io/router.middlewares: default-upload-size@kubernetescrd
#   OR configure the IngressRoute directly (see DEPLOY.md).
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: excel-ai-ingress
  namespace: excel-ai
  annotations:
    # Traefik — works with K3s default Traefik (no nginx install needed)
    # Allow larger uploads (Excel files up to 15MB)
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    # CHANGE THIS: use YOUR-ORACLE-IP.nip.io (free, no domain registration needed)
    # Example: if IP is 130.61.2.15 → host: 130.61.2.15.nip.io
    - host: YOUR-ORACLE-IP.nip.io
      http:
        paths:
          # API traffic → backend (must come before / to match first)
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-svc
                port:
                  number: 3001
          # All other traffic → frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-svc
                port:
                  number: 3000
---
# ── Traefik middleware to allow 15MB uploads ───────────────────────────────
# Apply after Traefik CRDs are ready (included in K3s)
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: upload-size
  namespace: excel-ai
spec:
  buffering:
    maxRequestBodyBytes: 15728640  # 15 MB
