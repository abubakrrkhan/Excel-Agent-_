# IMPORTANT: Do NOT commit real secrets.
# Use kubectl create secret or a secrets manager (e.g. Sealed Secrets) in production.
#
# To create the secret manually:
#   kubectl create secret generic excel-ai-secrets \
#     --namespace=excel-ai \
#     --from-literal=DATABASE_URL='postgresql://...' \
#     --from-literal=AI_API_KEY='sk-...' \
#     --from-literal=POSTGRES_PASSWORD='...'
#
apiVersion: v1
kind: Secret
metadata:
  name: excel-ai-secrets
  namespace: excel-ai
type: Opaque
stringData:
  DATABASE_URL: "postgresql://postgres:CHANGE_ME@postgres-svc:5432/excel_ai_db"
  AI_API_KEY: "CHANGE_ME"
  AI_MODEL: "claude-sonnet-4-6"
  AI_BASE_URL: "https://api.anthropic.com"
  POSTGRES_PASSWORD: "CHANGE_ME"
  VALKEY_URL: "redis://valkey-svc:6379"
