apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

bases:
  - ../../base

# Production overrides for Hetzner K3s single-node.
#
# REPLICAS: Keep at 1 for single-node K3s.
# The uploads PVC uses ReadWriteOnce — only one pod can mount it at a time.
# Scaling to 2 replicas would cause the second pod to fail to mount the volume.
# For multi-node HA: switch to ReadWriteMany (NFS/Longhorn) before increasing replicas.
patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: backend
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: frontend
